<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#F7F4ED" />
  <title>Downloading ZPad…</title>
  <link rel="canonical" href="https://zpad.app/get.html" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231C1712'/><rect x='7' y='7' width='86' height='86' rx='16' fill='none' stroke='%23F7F4ED' stroke-width='4'/><text x='50' y='71' font-size='58' font-family='-apple-system,sans-serif' font-weight='800' fill='%23F7F4ED' text-anchor='middle'>Z</text></svg>" />
  <link rel="stylesheet" href="assets/site.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <meta http-equiv="refresh" content="0; url=https://zpad.app/ZPad.dmg" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .relay { text-align: center; padding: 48px 40px; max-width: 440px; }
    .relay .brand-mark { width: 52px; height: 52px; border-radius: 14px; font-size: 26px; margin: 0 auto 24px; display: flex; }
    .relay h1 { font-family: var(--font-display); font-size: 24px; font-weight: 600; margin-bottom: 10px; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: center; gap: 12px; }
    .relay p { font-size: 14px; color: var(--ink-3); line-height: 1.65; margin-bottom: 20px; }
    .relay p.mono { font-family: var(--font-mono); font-size: 12px; color: var(--ink-4); margin-bottom: 26px; }
    .relay a { color: var(--accent-ink); font-weight: 600; border-bottom: 1px solid var(--line-strong); padding-bottom: 1px; }
    .relay a:hover { border-bottom-color: var(--accent-ink); }
    .spin {
      display: inline-block; width: 15px; height: 15px; border-radius: 50%;
      border: 2px solid var(--line); border-top-color: var(--accent);
      animation: spin 0.8s linear infinite; flex: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="relay">
    <span class="brand-mark" aria-hidden="true">Z</span>
    <h1><span class="spin" aria-hidden="true"></span>Starting your download…</h1>
    <p><strong style="color:var(--ink);">ZPad.dmg</strong> for macOS 15.1+ (Apple Silicon) should begin momentarily.</p>
    <p class="mono">$ curl -L -o ZPad.dmg https://zpad.app/ZPad.dmg</p>
    <noscript>
      <p><a href="https://zpad.app/ZPad.dmg">Click here if the download doesn't start</a></p>
    </noscript>
    <p style="margin-top: 24px;"><a href="download.html">← Back to downloads</a></p>
  </main>
  <script>
    // JS fallback for the meta-refresh: if the download hasn't triggered after
    // 3 seconds (rare environments), surface a direct retry link.
    setTimeout(function () {
      var fallback = document.createElement('p');
      fallback.innerHTML = 'Nothing happening? <a href="https://zpad.app/ZPad.dmg">Retry the download</a>';
      var anchor = document.querySelector('.mono');
      anchor.parentNode.insertBefore(fallback, anchor.nextSibling);
    }, 3000);
  </script>
</body>
</html>
