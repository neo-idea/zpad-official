<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Downloading ZPad…</title>
  <link rel="canonical" href="https://zpad.app/get.html" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23ef4444'/><text x='50' y='72' font-size='62' font-family='-apple-system,sans-serif' font-weight='800' fill='white' text-anchor='middle'>Z</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <meta http-equiv="refresh" content="0; url=https://github.com/neo-idea/zpad-downloads/releases/latest/download/ZPad.dmg" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Geist', -apple-system, sans-serif;
      background: #050505; color: #f5f5f7;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      text-align: center; padding: 48px 40px;
      max-width: 420px;
    }
    .logo {
      width: 52px; height: 52px; border-radius: 14px; margin: 0 auto 22px;
      background: linear-gradient(135deg, #ef4444, #ff2d2d);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 30px; color: #fff;
      box-shadow: 0 0 40px rgba(239, 68, 68, 0.3);
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 10px; letter-spacing: -0.01em; }
    p { font-size: 14px; color: rgba(255, 255, 255, 0.55); line-height: 1.6; margin-bottom: 22px; }
    p.mono { font-family: 'Geist Mono', monospace; font-size: 12px; color: rgba(255, 255, 255, 0.4); margin-bottom: 26px; }
    a {
      color: #ef4444; text-decoration: none; font-size: 14px; font-weight: 550;
      border-bottom: 1px solid rgba(239, 68, 68, 0.4); padding-bottom: 2px;
    }
    a:hover { border-bottom-color: #ef4444; }
    .spin {
      display: inline-block; width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.15); border-top-color: #ef4444;
      animation: spin 0.8s linear infinite; vertical-align: -2px; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">Z</div>
    <h1><span class="spin"></span>Starting your download…</h1>
    <p>ZPad.dmg for macOS 15.1+ (Apple Silicon) should begin momentarily.</p>
    <p class="mono">$ curl -L zpad.app/get.html -o ZPad.dmg</p>
    <noscript>
      <p><a href="https://github.com/neo-idea/zpad-downloads/releases/latest/download/ZPad.dmg">Click here if the download doesn't start</a></p>
    </noscript>
    <p style="margin-top: 26px;"><a href="download.html">← Back to downloads</a></p>
  </main>
  <script>
    // JS 关闭 meta-refresh 的兜底：3 秒仍未触发下载则点出直链（极少数环境）
    setTimeout(() => {
      const fallback = document.createElement('p');
      fallback.innerHTML = 'Nothing happening? <a href="https://github.com/neo-idea/zpad-downloads/releases/latest/download/ZPad.dmg">Retry the download</a>';
      document.querySelector('.card').insertBefore(fallback, document.querySelector('.mono').nextSibling);
    }, 3000);
  </script>
</body>
</html>
